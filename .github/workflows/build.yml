name: build

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ['ubuntu-latest', 'macos-latest', 'windows-latest']
    steps:
    - uses: actions/checkout@v4
    - name: Windows
      if: matrix.os == 'windows-latest'
      run: |
        msbuild inipp.sln
        vstest.console /Platform:x64 x64\Debug\unittest.dll
    - name: Ubuntu/MacOS
      if: matrix.os != 'windows-latest'
      run: |
        cmake .
        make
        make test
